<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where in the world?</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="wrapper header__inner">
      <h1 class="header__title">Where in the world?</h1>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <svg class="theme-toggle__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Dark Mode</span>
      </button>
    </div>
  </header>

  <main class="main wrapper">
    <div class="controls">
      <div class="search">
        <svg class="search__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" id="searchInput" class="search__input" placeholder="Search for a country..." aria-label="Search for a country" />
      </div>

      <div class="filter">
        <button class="filter__button" id="filterButton" type="button" aria-haspopup="listbox" aria-expanded="false">
          <span id="filterLabel">Filter by Region</span>
          <svg class="filter__chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <ul class="filter__list" id="filterList" role="listbox" hidden>
          <li role="option" data-region="">All</li>
          <li role="option" data-region="Africa">Africa</li>
          <li role="option" data-region="Americas">Americas</li>
          <li role="option" data-region="Asia">Asia</li>
          <li role="option" data-region="Europe">Europe</li>
          <li role="option" data-region="Oceania">Oceania</li>
        </ul>
      </div>
    </div>

    <p class="status" id="statusMessage" hidden></p>

    <div class="grid" id="countryGrid" aria-live="polite"></div>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/countries-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
